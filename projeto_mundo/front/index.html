<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRUD Mundo - Países</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background-color: #f5f5f5;
    }
    
    h1 {
      color: #333;
      text-align: center;
    }
    
    h2 {
      color: #555;
      margin-top: 40px;
    }
    
    form {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    
    input {
      width: 100%;
      padding: 8px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
    }
    
    button {
      background-color: #4CAF50;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 10px;
    }
    
    button:hover {
      background-color: #45a049;
    }
    
    iframe {
      width: 100%;
      height: 400px;

<body>
  <h1>🌍 Cadastro de Países</h1>
  
  <form action="../back/inserir_pais.php" method="POST">
    <label>Nome do País:</label>
    <input type="text" name="nome" placeholder="Ex: Brasil" required>
    
    <label>Continente:</label>
    <input type="text" name="continente" placeholder="Ex: América do Sul" required>
    
    <label>População:</label>
    <input type="number" name="populacao" placeholder="Ex: 214300000" required>
    
    <label>Idioma:</label>
    <input type="text" name="idioma" placeholder="Ex: Português" required>
    
    <button type="submit">Cadastrar País</button>
  </form>

  <h2>📋 Lista de Países Cadastrados</h2>
  <iframe src="../back/listar_paises.php"></iframe>
</body>
</html>
